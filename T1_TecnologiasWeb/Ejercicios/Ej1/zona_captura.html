<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="atrapalos.css">
</head>
<body>

    <main id="main">
        <h1>Zona de captura</h1>
        <p>Describe al monstruo. Al pulsar «Capturar» comprobaremos si estás cerca del instituto.</p>

        <form id="form-captura">
            <div>
                <label for="monstruo-nombre">Nombre:</label>
                <input type="text" id="monstruo-nombre" required>
            </div>
            <div>
                <label for="monstruo-edad">Edad:</label>
                <input type="number" id="monstruo-edad" min="0" required>
            </div>
            <div>
                <label for="monstruo-color">Color:</label>
                <input type="color" id="monstruo-color" value="#8B6FC7">
            </div>
            <button type="submit">Capturar</button>
            <p id="estado-captura" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script src="atrapalos.js"></script>
</body>
</html>
